        <section id="chat-section" class="chat-card">
            <div class="section-header">
                <h3>Gesprächsfenster</h3>
                <p class="session-line">Sitzung: <span id="session-id">noch nicht gestartet</span></p>
            </div>
            <div id="chat" class="chat-log" aria-live="polite"></div>
            <form id="chat-form" class="chat-form">
                <label class="sr-only" for="message">Nachricht</label>
                <textarea id="message" name="message" rows="4" maxlength="4000" placeholder="Beschreibe, was dich gerade beschaeftigt."></textarea>
                <div class="form-row">
                    <button type="submit">Nachricht senden</button>
                    <button type="button" id="reset-chat" class="secondary">Verlauf loeschen</button>
                </div>
            </form>
        </section>

        <section id="config-section" class="control-card">
            <div class="section-header">
                <h3>Konfiguration</h3>
                <p id="mode-description" class="mode-description">Script-basiert mit Keyword-Prioritaeten und ELIZA-typischen Reassemblies.</p>
            </div>
            <div class="config-grid">
                <div>
                    <label class="field-label" for="mode">Gespraechsmodus</label>
                    <select id="mode" class="mode-select">
                        <option value="eliza">ELIZA</option>
                        <option value="llm">moderner Chatbot</option>
                    </select>
                </div>
                <div>
                    <label class="field-label" for="style">Therapeutischer Stil</label>
                    <select id="style" class="mode-select">
                        {% for style_key, style_value in styles.items() %}
                        <option value="{{ style_key }}">{{ style_value.label }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        </section>
    </main>

    <template id="message-template">
        <article class="bubble-wrap">
            <div class="bubble-meta"></div>
            <div class="bubble"></div>
        </article>
    </template>
