<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | ELIZSA LLM Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <main class="admin-shell">
        <section class="admin-list">
            <p class="eyebrow">Admin Login</p>
            <h1>Passwortschutz</h1>
            <p class="lead">Melde dich an, um auf gespeicherte Sitzungen und Admin-APIs zuzugreifen.</p>
            {% if error %}
            <p class="pill warn">{{ error }}</p>
            {% endif %}
            <form class="chat-form" method="post" action="/admin/login">
                <label class="field-label" for="password">Admin-Passwort</label>
                <input id="password" name="password" type="password" class="mode-select" required>
                <div class="form-row">
                    <button type="submit">Anmelden</button>
                    <a class="admin-link" href="/">Zurueck zum Chat</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
