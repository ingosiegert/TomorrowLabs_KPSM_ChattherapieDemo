<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zugangscode | ELIZSA LLM Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <main class="admin-shell">
        <section class="admin-list">
            <p class="eyebrow">Demo-Zugang</p>
            <h1>Zugriffscode erforderlich</h1>
            <p class="lead">Gib den Zugriffscode ein, um die Demo zu nutzen.</p>
            {% if error %}
            <p class="pill warn">{{ error }}</p>
            {% endif %}
            <form class="chat-form" method="post" action="/zugang">
                <label class="field-label" for="access_code">Zugriffscode</label>
                <input id="access_code" name="access_code" type="password" class="mode-select" required>
                <div class="form-row">
                    <button type="submit">Freischalten</button>
                    <a class="admin-link" href="/erklaerung">Hintergrund</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
